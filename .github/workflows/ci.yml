name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # 画面（WPF）も含めて、実際に使う Windows で確かめる
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: |
          dotnet build src/TremorScope.App --configuration Release
          dotnet build tests/TremorScope.Tests --configuration Release

      - name: Test
        run: dotnet test --project tests/TremorScope.Tests --configuration Release --no-build

      # データの形（エンティティ）を変えたのに、データベースの変更手順（マイグレーション）を作り忘れていないか
      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/TremorScope.Infrastructure -s src/TremorScope.Infrastructure --configuration Release --no-build

  web:
    # ブラウザー版（Blazor WebAssembly）がビルドできるかを確かめる
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build src/TremorScope.Web --configuration Release
